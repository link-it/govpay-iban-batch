# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

# Application name
spring.application.name=govpay-iban-batch

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Rome

# directory for reports
govpay.report.dir=/tmp

# Report mail configuration
# Il server SMTP viene letto dalla configurazione GovPay (tabella configurazione, chiave "mail_batch")
govpay.report.invia_mail=false
govpay.report.oggetto=Report Check IBAN
govpay.report.messaggio=In allegato il report di verifica IBAN.
govpay.report.destinatario=

# Spring Batch configuration
spring.batch.job.enabled=false

# Batch configuration
govpay.batch.enabled=true
govpay.batch.thread-pool-size=5
govpay.batch.skip-limit=10

# Cluster ID configuration (unique identifier for each node in multi-node setup)
govpay.batch.cluster-id=GovPay-iban-Batch

# Multi-node job execution timeout configuration
# Maximum minutes since last update before a job is considered stale/stuck (default: 120 minutes = 2 hours)
govpay.batch.stale-threshold-minutes=120

# Scheduler configuration
# Fixed delay between job executions (in milliseconds) - default 2 hours
scheduler.ibanCheckJob.fixedDelayString=7200000
# Initial delay before first execution (in milliseconds) - default 1ms
scheduler.initialDelayString=1

# Actuator configuration
management.endpoints.web.base-path=/actuator
# 'loggers' NON e' incluso di default: qui actuator risponde sulla porta
# applicativa e il componente non ha Spring Security, quindi sarebbe un endpoint
# di scrittura non autenticato (BP-SEC-2). Va abilitato solo insieme a una porta
# management dedicata e segregata in rete, per esempio:
#   MANAGEMENT_SERVER_PORT=9090 MANAGEMENT_ENDPOINTS=health,info,metrics,prometheus,loggers
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
# Tag comune per distinguere il servizio quando Prometheus raccoglie piu' app.
management.metrics.tags.application=govpay-iban-batch

# ------------ LOGGING (govpay-common) ------------------
# Transaction id e correlation id in ogni riga di log (BP-LOG-3). Per un batch
# l'unita' di lavoro e' l'esecuzione del job: JobExecutionHelper apre il contesto
# a ogni avvio, con un transaction id nuovo e il correlation id ereditato da chi
# ha lanciato il job (avvio manuale via REST) oppure generato (cron/schedulato).
# Il correlation id e' registrato come parametro di job non identificante, quindi
# resta nei metadati Spring Batch e nell'API delle esecuzioni.
logging.pattern.level=%5p [%X{transactionId:-},%X{correlationId:-}]

# Livelli di log modificabili a runtime (BP-LOG-1). La sorgente e' la riga
# log_level della tabella configurazione, condivisa con gli altri componenti:
# una modifica fatta dalla console raggiunge anche questo batch entro
# l'intervallo di refresh, senza endpoint di gestione locali.
govpay.logging.livelli-dinamici.enabled=true
govpay.logging.livelli-dinamici.intervallo-refresh=${LOG_LEVEL_REFRESH_INTERVAL:60s}
govpay.logging.livelli-dinamici.logger-gestiti[0]=it.govpay
